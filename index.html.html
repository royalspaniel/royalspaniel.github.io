<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Mc.Nuget</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
        <div class="mainColumns" id="leftColumn">
            <h1 id="nuggetTotalText"></h1>
            <h3 id="nuggetsPerSecondText"></h3>
            <div id="nuggetBouncer">
                <div id="nuggetSpinner">
                    <img src="images/nuggett.png" id="nugget">
                </div>
            </div>
        </div>


        <div class="mainColumns" id="centerColumn">
           <div id="ketchupContainer" class="centerContainer"></div>
           <div id="fryContainer" class="centerContainer"></div>
            <div id="sodaContainer" class="centerContainer"></div>
<div id="mealContainer" class="centerContainer"  ></div> 
<div id="mascotContainer" class="centerContainer"></div>
<div id="adContainer" class="centerContainer"></div>
<div id="townContainer" class="centerContainer"></div>
<div id="cityContainer" class="centerContainer"></div>
<div id="islandContainer" class="centerContainer"></div>
<div id="planetContainer" class="centerContainer"></div>
<div id="solarContainer" class="centerContainer"></div>
<div id="galaxyContainer" class="centerContainer"></div>         
        </div>


        <div class="mainColumns" id="rightColumn">
            <div id="buyKetchup" class="shopItem">
                <img src="images/cetchup.png" class="shopIcon">
                <div class="shopDetails">
                    <h1 class="shopItemTitle">Ketchup</h1>
                    <p id="ketchupPrice" class="shopItemPrice">20</p>
                </div>
                <div id="ketchupQuantity" class="itemQuantity">0</div>
            </div>

            <div id="buyFry" class="shopItem">
               <img src="images/frenchfry.png" class="shopIcon">
               <div class="shopDetails">
                   <h1 class="shopItemTitle">French-Fry</h1>
                   <p id="fryPrice" class="shopItemPrice">40</p>
               </div>
               <div id="fryQuantity" class="itemQuantity">0</div>
           </div>

           <div id="buySoda" class="shopItem">
            <img src="images/soda.png" class="shopIcon">
            <div class="shopDetails">
                <h1 class="shopItemTitle">Soda</h1>
                <p id="sodaPrice" class="shopItemPrice">70</p>
            </div>
            <div id="sodaQuantity" class="itemQuantity">0</div>
        </div>

        <div id="buyMeal" class="shopItem">
         <img id="Center" src="images/HappyMeal.png" class="shopIcon">
         <div class="shopDetails">
             <h1 class="shopItemTitle">Happy-Meal</h1>
             <p id="mealPrice" class="shopItemPrice">300</p>
         </div>
         <div id="mealQuantity" class="itemQuantity">0</div>
     </div>

     <div id="buyMascot" class="shopItem">
      <img id="Marscot" src="images/mascot.png" class="shopIcon">
      <div class="shopDetails">
          <h1 class="shopItemTitle">Mascot</h1>
          <p id="mascotPrice" class="shopItemPrice">800</p>
      </div>
      <div id="mascotQuantity" class="itemQuantity">0</div>
  </div>

  <div id="buyAd" class="shopItem">
   <img src="images/ad.png" class="shopIcon">
   <div class="shopDetails">
       <h1 class="shopItemTitle">Advertisement</h1>
       <p id="adPrice" class="shopItemPrice">3,000</p>
   </div>
   <div id="adQuantity" class="itemQuantity">0</div>
</div>

<div id="buyTown" class="shopItem">
    <img src="images/town.png" class="shopIcon">
    <div class="shopDetails">
        <h1 class="shopItemTitle">Mc.Town</h1>
        <p id="townPrice" class="shopItemPrice">5,500</p>
    </div>
    <div id="townQuantity" class="itemQuantity">0</div>
 </div>

 <div id="buyCity" class="shopItem">
    <img src="images/city.png" class="shopIcon">
    <div class="shopDetails">
        <h1 class="shopItemTitle">Mc.City</h1>
        <p id="cityPrice" class="shopItemPrice">9,500</p>
    </div>
    <div id="cityQuantity" class="itemQuantity">0</div>
 </div>

 <div id="buyIsland" class="shopItem">
    <img src="images/island.png" class="shopIcon">
    <div class="shopDetails">
        <h1 class="shopItemTitle">Mc.Island</h1>
        <p id="islandPrice" class="shopItemPrice">15,000</p>
    </div>
    <div id="islandQuantity" class="itemQuantity">0</div>
 </div>

 <div id="buyPlanet" class="shopItem">
    <img src="images/planet.png" class="shopIcon">
    <div class="shopDetails">
        <h1 class="shopItemTitle">Mc.Planet</h1>
        <p id="planetPrice" class="shopItemPrice">25,000</p>
    </div>
    <div id="planetQuantity" class="itemQuantity">0</div>
 </div>

 <div id="buySolar" class="shopItem">
    <img src="images/solar.png" class="shopIcon">
    <div class="shopDetails">
        <h1 class="shopItemTitle">Mc.Solar-System</h1>
        <p id="solarPrice" class="shopItemPrice">50,000</p>
    </div>
    <div id="solarQuantity" class="itemQuantity">0</div>
 </div>

 <div id="buyGalaxy" class="shopItem">
    <img src="images/galaxy.png" class="shopIcon">
    <div class="shopDetails">
        <h1 class="shopItemTitle">Mc.Galaxy</h1>
        <p id="galaxyPrice" class="shopItemPrice">1,000,000</p>
    </div>
    <div id="galaxyQuantity" class="itemQuantity">0</div>
 </div>

        </div>


</body>

<script src="scripts.js"></script>

</html>
